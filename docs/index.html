<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Jump</title>
<script>
/* Master gain at 25% (= 75% quieter) for all game audio. Runs before Unity creates its AudioContext. */
(function(){
  var VOL=0.25,ctxs=[];
  ['AudioContext','webkitAudioContext'].forEach(function(name){
    var Orig=window[name];if(!Orig)return;
    function Wrapped(opts){
      var c=new Orig(opts);
      try{var g=c.createGain();g.gain.value=VOL;g.connect(c.destination);Object.defineProperty(c,'destination',{value:g,configurable:true})}catch(e){}
      ctxs.push(c);return c;
    }
    Wrapped.prototype=Orig.prototype;window[name]=Wrapped;
  });
  function each(fn){ctxs.forEach(function(c){try{fn(c)}catch(e){}})}

  /* the hub (parent page) talks to the game by message, so it works from any origin */
  function fire(type){
    var ev=new KeyboardEvent(type,{key:' ',code:'Space',keyCode:32,which:32,bubbles:true,cancelable:true});
    if(ev.keyCode!==32){Object.defineProperty(ev,'keyCode',{get:function(){return 32}});Object.defineProperty(ev,'which',{get:function(){return 32}})}
    (document.getElementById('unity-canvas')||document).dispatchEvent(ev);
  }
  window.addEventListener('message',function(e){
    var d=e.data;if(e.source!==parent||!d||!d.tj)return;
    if(d.tj==='key')fire(d.down?'keydown':'keyup');
    else if(d.tj==='resume')each(function(c){if(c.state==='suspended')c.resume()});
    else if(d.tj==='stop')each(function(c){c.close()});
  });
  /* real Space / Escape inside the game are reported to the hub so its jump button mirrors them */
  function tell(m){try{parent.postMessage(m,'*')}catch(e){}}
  window.addEventListener('keydown',function(e){
    if(e.code==='Space'&&!e.repeat)tell({tj:'down'});else if(e.key==='Escape')tell({tj:'exit'});
  },true);
  window.addEventListener('keyup',function(e){if(e.code==='Space')tell({tj:'up'})},true);
})();
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07080B}
#unity-canvas{display:block;width:100%;height:100%;background:#07080B;outline:none}
#bar{position:absolute;left:20%;right:20%;top:50%;height:8px;margin-top:-4px;border-radius:8px;background:#1d212b;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#7BE06A;transition:width .15s}
#warn{position:absolute;left:0;right:0;bottom:0;font:600 12px system-ui,sans-serif;color:#fff}
#warn div{padding:8px 10px}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="bar"><i id="fill"></i></div>
<div id="warn"></div>
<script>
(function(){
  var warn=document.getElementById('warn'),fill=document.getElementById('fill');
  function banner(msg,type){
    var d=document.createElement('div');d.textContent=msg;
    d.style.background=type==='error'?'#c0392b':'#a67c00';warn.appendChild(d);
    if(type!=='error')setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},5000);
  }
  function bar(p){fill.style.width=(100*Math.min(1,p))+'%'}

  /* GitHub Pages serves .gz files without Content-Encoding, so the browser unzips them here.
     That keeps the repo at ~19 MB instead of ~40 MB. */
  var FILES=[
    {k:'data',url:'Build/html.data.gz',type:'application/octet-stream',size:13024977},
    {k:'framework',url:'Build/html.framework.js.gz',type:'application/javascript',size:77199},
    {k:'wasm',url:'Build/html.wasm.gz',type:'application/wasm',size:6001331}
  ];
  var TOTAL=FILES.reduce(function(a,f){return a+f.size},0),got=0;

  function load(f){
    return fetch(f.url).then(function(r){
      if(!r.ok)throw new Error(f.url+' ('+r.status+')');
      var already=r.headers.get('content-encoding');   /* some hosts unzip for us */
      var rd=r.body.getReader();
      var counted=new ReadableStream({pull:function(c){
        return rd.read().then(function(x){if(x.done){c.close();return}got+=x.value.length;bar(.7*got/TOTAL);c.enqueue(x.value)});
      }});
      var out=already?counted:counted.pipeThrough(new DecompressionStream('gzip'));
      return new Response(out,{headers:{'Content-Type':f.type}}).blob();
    }).then(function(b){return URL.createObjectURL(b)});
  }

  if(!window.DecompressionStream){banner('This browser is too old to load the game. Please update it.','error');return}
  var s=document.createElement('script');
  s.src='Build/html.loader.js';
  s.onload=function(){
    Promise.all(FILES.map(load)).then(function(u){
      return createUnityInstance(document.getElementById('unity-canvas'),{
        dataUrl:u[0],frameworkUrl:u[1],codeUrl:u[2],
        streamingAssetsUrl:'StreamingAssets',
        companyName:'Rüzgar Yalçın',productName:'Tower Jump',productVersion:'0.1',
        cacheControl:function(){return 'no-store'},   /* blob URLs change every load: don't fill IndexedDB */
        showBanner:banner
      },function(p){bar(.7+.3*p)});
    }).then(function(){document.getElementById('bar').style.display='none'})
      .catch(function(m){banner(String(m&&m.message||m),'error')});
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
